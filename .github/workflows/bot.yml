name: HiddenGem Telegram Forward Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

# Prevent overlapping bot instances.
concurrency:
  group: hiddengem-telegram-forward-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # The bot runtime is intentionally shorter than the 10-minute schedule.
    timeout-minutes: 9

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      MAIN_CHANNEL_ID: ${{ secrets.MAIN_CHANNEL_ID }}
      TARGET_CHANNELS: ${{ secrets.TARGET_CHANNELS }}
      FORWARD_DELAY: ${{ secrets.FORWARD_DELAY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Telegram bot for 8 minutes
        shell: bash
        run: |
          set +e

          timeout \
            --signal=SIGTERM \
            --kill-after=30s \
            8m \
            npm start

          status=$?

          # Exit code 124 is the expected timeout after the 8-minute
          # scheduled runtime window. Treat it as a successful cycle.
          if [ "$status" -eq 124 ]; then
            echo "Bot runtime window completed normally."
            exit 0
          fi

          echo "Bot exited with status: $status"
          exit "$status"
