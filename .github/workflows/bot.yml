name: HiddenGem Telegram Forward Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # The bot itself is intentionally stopped before the next scheduled run.
    timeout-minutes: 9

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      MAIN_CHANNEL_ID: ${{ secrets.MAIN_CHANNEL_ID }}
      TARGET_CHANNELS: ${{ secrets.TARGET_CHANNELS }}
      FORWARD_DELAY: ${{ secrets.FORWARD_DELAY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Telegram bot for 8 minutes
        shell: bash
        run: |
          set +e
          timeout --signal=SIGTERM --kill-after=30s 8m npm start
          status=$?

          if [ "$status" -eq 124 ]; then
            echo "Bot runtime window completed normally."
            exit 0
          fi

          exit "$status"
